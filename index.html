<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,user-scalable=yes,viewport-fit=cover">
<title>2027학년도 입학 안내 | 안산디자인문화고등학교</title>
<style>
:root{--green:#254d35;--green2:#183726;--ink:#222;--shadow:0 16px 42px rgba(20,33,25,.20)}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Pretendard","Noto Sans KR","Malgun Gothic",Arial,sans-serif;background:linear-gradient(180deg,#f7f9f7 0,#eef3ef 100%);color:var(--ink)}
.wrap{max-width:1280px;margin:0 auto;padding:24px 18px 40px}
.hero{background:var(--green);color:#fff;border-radius:18px 18px 0 0;padding:22px 24px 20px;text-align:center;box-shadow:var(--shadow)}
.hero .eyebrow{font-size:14px;opacity:.82;letter-spacing:.06em;margin-bottom:7px}
.hero h1{margin:0;font-size:clamp(22px,3vw,34px);line-height:1.3}
.hero p{margin:10px 0 0;font-size:14px;opacity:.88}
.viewer{background:#e9ede9;border-radius:0 0 18px 18px;padding:22px;box-shadow:var(--shadow);overflow:hidden}
.toolbar{display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:16px}
button,.download{appearance:none;border:1px solid #cbd3cc;background:#fff;color:#243329;border-radius:10px;padding:10px 14px;font-weight:700;font-size:14px;cursor:pointer;text-decoration:none;box-shadow:0 2px 8px rgba(0,0,0,.05)}
button:hover,.download:hover{background:#f6faf6}
button:disabled{opacity:.35;cursor:default}
.primary{background:var(--green);border-color:var(--green);color:#fff}.primary:hover{background:var(--green2)}
.counter{min-width:112px;text-align:center;font-weight:800;font-variant-numeric:tabular-nums;color:#33473b}
.download-group{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-left:4px}
.download.important{border:0;color:#fff;padding:11px 16px;font-size:14px;font-weight:800;box-shadow:0 4px 12px rgba(25,70,130,.24);transition:transform .18s ease,box-shadow .18s ease,filter .18s ease}
.download.important:hover{color:#fff;transform:translateY(-2px);filter:brightness(1.03)}
.download.pdf-btn{background:#245aa8}.download.form-btn{background:#e57a1f}
.book-shell{position:relative;perspective:2200px;max-width:1120px;margin:0 auto;touch-action:pan-y pinch-zoom;user-select:none}
.book{display:flex;align-items:stretch;justify-content:center;min-height:340px;transform-style:preserve-3d;transition:transform .18s ease}
.page{position:relative;background:#fff;overflow:hidden;cursor:pointer;box-shadow:0 12px 30px rgba(0,0,0,.16);transform-style:preserve-3d;backface-visibility:hidden}
.page img{display:block;width:100%;height:auto;max-height:74vh;object-fit:contain;background:#fff}
.page.left{border-radius:12px 2px 2px 12px;transform-origin:right center}
.page.right{border-radius:2px 12px 12px 2px;transform-origin:left center}
.page.left:after,.page.right:before{content:"";position:absolute;top:0;bottom:0;width:26px;pointer-events:none;z-index:2}
.page.left:after{right:0;background:linear-gradient(90deg,transparent,rgba(0,0,0,.10))}
.page.right:before{left:0;background:linear-gradient(90deg,rgba(0,0,0,.10),transparent)}
.spread .page{width:50%}.cover .page{width:min(560px,78%);border-radius:12px}.cover .page:before,.cover .page:after{display:none}
.turn-next{animation:turnNext .46s cubic-bezier(.4,0,.2,1)}.turn-prev{animation:turnPrev .46s cubic-bezier(.4,0,.2,1)}
@keyframes turnNext{0%{transform:rotateY(0)}45%{transform:rotateY(-10deg) translateX(-8px)}100%{transform:rotateY(0)}}
@keyframes turnPrev{0%{transform:rotateY(0)}45%{transform:rotateY(10deg) translateX(8px)}100%{transform:rotateY(0)}}
.hint{text-align:center;margin:14px 0 0;color:#5b675f;font-size:13px}.mobile-note{display:none}
.mobile-zoom-controls{display:none}
.progress{height:5px;border-radius:999px;background:#d5ddd7;overflow:hidden;max-width:720px;margin:16px auto 0}.progress>span{display:block;height:100%;background:var(--green);width:0;transition:width .25s ease}

    .section-menu{display:flex;justify-content:center;align-items:flex-start;gap:8px;flex-wrap:wrap;margin:0 0 16px;position:relative;z-index:20}
    .section-menu button{white-space:nowrap}
    .dept-menu{position:relative}
    .dept-sub{display:none;position:absolute;left:0;top:44px;min-width:178px;background:#fff;border:1px solid #d7ded8;border-radius:10px;padding:6px;box-shadow:0 10px 24px rgba(0,0,0,.15);z-index:30}
    .dept-sub.open{display:block}
    .dept-sub button{display:block;width:100%;text-align:left;box-shadow:none;border:0}

@media(max-width:760px){
  .section-menu{justify-content:flex-start;flex-wrap:nowrap;overflow-x:auto;padding:0 2px}.section-menu::-webkit-scrollbar{display:none}.dept-sub{position:fixed;left:12px;right:12px;top:auto;min-width:0}.wrap{padding:0 0 16px}.hero{border-radius:0;padding:18px 14px}.viewer{border-radius:0;padding:14px 8px 16px;box-shadow:none}
  .hero .eyebrow{font-size:12px}.hero h1{font-size:clamp(18px,5.2vw,26px);line-height:1.28;word-break:keep-all;white-space:nowrap;letter-spacing:-.03em}.hero p{font-size:12px;line-height:1.55;word-break:keep-all}
  .toolbar{gap:8px;margin-bottom:14px}.toolbar button{padding:10px 12px;font-size:14px}.counter{min-width:86px;font-size:14px}
  .download-group{width:100%;justify-content:center;margin:6px 6px 0}.download.important{flex:1 1 100%;text-align:center;padding:13px 10px;font-size:14px}
  .mobile-zoom-controls{display:flex;justify-content:center;align-items:center;gap:8px;margin:10px 0 2px}.mobile-zoom-controls button{min-width:46px;padding:8px 12px}.mobile-zoom-controls .zoom-level{min-width:64px;text-align:center;font-size:13px;font-weight:800;color:#435147}
  .book-shell{width:100%;max-width:none;padding:0 6px;touch-action:none;overflow:visible}.book{min-height:0;width:100%;transform-origin:center center;will-change:transform}
  .spread .page,.cover .page{width:min(94vw,620px);aspect-ratio:1100/1556;flex:0 0 auto}.spread .page.left{display:none}.spread .page.right{border-radius:9px}.spread .page.right:before{display:none}
  .page img{max-height:none;width:100%;height:100%;object-fit:contain}
  .turn-next,.turn-prev{animation:none!important}
  .mobile-note{display:block;text-align:center;font-size:12px;color:#657269;margin:10px 0 0}.book.zoomed{cursor:grab}.book.zoomed:active{cursor:grabbing}.hint{font-size:12px;line-height:1.55;margin:10px 8px 0}.progress{margin:12px 8px 0}
}

/* v8 compact controls */
.section-menu{
  gap:6px!important;
  margin:10px 0 8px!important;
}
.section-menu button{
  padding:8px 11px!important;
  font-size:13px!important;
  border-radius:8px!important;
  box-shadow:none!important;
}
.toolbar{
  gap:10px!important;
  margin:4px 0 8px!important;
  align-items:center!important;
}
.toolbar #prev,.toolbar #next{
  background:transparent!important;
  border:0!important;
  box-shadow:none!important;
  padding:6px 8px!important;
  color:#24563b!important;
  font-weight:900!important;
}
.toolbar #counter{
  min-width:72px!important;
  text-align:center!important;
  font-weight:900!important;
}
.toolbar #zoom{
  padding:7px 10px!important;
  border-radius:8px!important;
  box-shadow:none!important;
}
.download-group{
  margin:0 0 9px!important;
}
.download-group .download{
  box-shadow:none!important;
}
@media(max-width:760px){
  .section-menu{
    display:flex!important;
    flex-wrap:nowrap!important;
    overflow-x:auto!important;
    justify-content:flex-start!important;
    gap:5px!important;
    margin:7px 0 5px!important;
    padding:0 4px 2px!important;
    -webkit-overflow-scrolling:touch;
  }
  .section-menu::-webkit-scrollbar{display:none}
  .section-menu button{
    flex:0 0 auto!important;
    padding:7px 9px!important;
    font-size:12px!important;
  }
  .toolbar{
    display:flex!important;
    flex-wrap:wrap!important;
    justify-content:center!important;
    gap:3px 8px!important;
    margin:3px 0 6px!important;
  }
  .toolbar #prev,.toolbar #next{
    width:auto!important;
    min-width:70px!important;
    font-size:14px!important;
    padding:5px 4px!important;
  }
  .toolbar #counter{
    width:auto!important;
    min-width:68px!important;
    font-size:14px!important;
  }
  .toolbar #zoom{
    width:auto!important;
    font-size:13px!important;
    padding:6px 9px!important;
  }
  .download-group{
    width:100%!important;
    margin:0 0 8px!important;
  }
  .download-group .download{
    display:block!important;
    width:100%!important;
    padding:10px 12px!important;
    font-size:14px!important;
    border-radius:9px!important;
    text-align:center!important;
  }
}


@media(max-width:760px){
  .hero{
    display:block!important;
    padding:14px 12px 13px!important;
    border-radius:0!important;
  }
  .hero .school{
    font-size:10px!important;
    margin-bottom:4px!important;
  }
  .hero h1{
    font-size:22px!important;
    line-height:1.25!important;
    margin:0 0 5px!important;
  }
  .hero p{
    font-size:10px!important;
    line-height:1.35!important;
    margin:0!important;
  }
}


/* v11 mobile precise fixes */
@media(max-width:760px){
  /* Do not force a paper aspect ratio on mobile: show the JPG at its natural ratio */
  .spread .page,.cover .page{
    width:min(94vw,620px)!important;
    height:auto!important;
    aspect-ratio:auto!important;
    flex:0 0 auto!important;
  }
  .page img{
    display:block!important;
    width:100%!important;
    height:auto!important;
    max-height:none!important;
    object-fit:fill!important;
    margin:0!important;
    padding:0!important;
  }

  /* Department submenu is a floating panel positioned by JS under the button */
  .dept-sub{
    position:fixed!important;
    top:0;
    left:0;
    right:auto!important;
    min-width:210px!important;
    width:230px!important;
    max-width:calc(100vw - 24px)!important;
    max-height:55vh!important;
    overflow-y:auto!important;
    z-index:999999!important;
    background:#fff!important;
    border:1px solid #d7ded8!important;
    border-radius:10px!important;
    padding:6px!important;
    box-shadow:0 10px 26px rgba(0,0,0,.22)!important;
  }
  .dept-sub button{
    width:100%!important;
    padding:10px 12px!important;
    text-align:left!important;
    font-size:13px!important;
  }
}

</style>
</head>
<body>
<div class="wrap">
  <section class="hero">
    <div class="eyebrow">안산디자인문화고등학교</div>
    <h1>2027학년도 입학 안내</h1>
    <p>좌우 버튼 또는 화면 스와이프로 브로슈어를 넘겨 확인할 수 있습니다.</p>
  </section>
  <section class="viewer" id="viewer">

    <div class="section-menu">
      <button type="button" data-goto="0">처음</button>
      <div class="dept-menu">
        <button type="button" id="deptBtn">학과소개 ▼</button>
        <div class="dept-sub" id="deptSub">
          <button type="button" data-goto="3">미디어콘텐츠과</button>
          <button type="button" data-goto="5">스마트경영과</button>
          <button type="button" data-goto="7">공연콘텐츠과</button>
          <button type="button" data-goto="9">시각디자인과</button>
          <button type="button" data-goto="11">패션디자인과</button>
        </div>
      </div>
      <button type="button" data-goto="13">진학·취업</button>
      <button type="button" data-goto="17">도제학교</button>
      <button type="button" data-goto="19">특색사업</button>
      <button type="button" data-goto="21">입학요항</button>
      <button type="button" data-goto="27">디문고 더보기</button>
    </div>

    <div class="toolbar">
      <button id="prev" aria-label="이전 페이지">◀ 이전</button>
      <span class="counter" id="counter">1 / 32</span>
      <button id="next" class="primary" aria-label="다음 페이지">다음 ▶</button>
      <button id="zoom" title="새 창에서 현재 페이지 크게 보기">🔍 크게 보기</button>
      <div class="download-group">
        <a class="download important pdf-btn" href="brochure.pdf" download="2027학년도_입학안내_안산디자인문화고.pdf">📄 입학안내 PDF 다운로드</a>
      </div>
    </div>
    <div class="book-shell" id="shell"><div class="book cover" id="book" aria-live="polite"></div></div>
    <div class="mobile-zoom-controls" aria-label="문서 확대 축소">
      <button type="button" id="zoomOutMobile" aria-label="축소">−</button>
      <span class="zoom-level" id="zoomLevelMobile">100%</span>
      <button type="button" id="zoomInMobile" aria-label="확대">＋</button>
      <button type="button" id="zoomResetMobile" aria-label="확대 초기화">원래크기</button>
    </div>
    <div class="mobile-note">휴대전화에서는 한 페이지씩 표시되며, 두 손가락으로 확대·축소할 수 있습니다.</div>
    <div class="hint">페이지의 왼쪽·오른쪽을 클릭하거나 화면을 좌우로 밀고, 키보드 ← → 키로도 이동할 수 있습니다.</div>
    <div class="progress"><span id="bar"></span></div>
  </section>
</div>
<script>
const pages=Array.from({length:32},(_,i)=>`page-${String(i+1).padStart(2,'0')}.jpg`);
pages.forEach(src=>{const im=new Image();im.src=src;});
const book=document.getElementById('book'),prev=document.getElementById('prev'),next=document.getElementById('next'),counter=document.getElementById('counter'),bar=document.getElementById('bar');
let index=0,animating=false,swiped=false,sx=0,pinching=false;
let zoomScale=1,zoomX=0,zoomY=0,startDist=0,startScale=1,startMidX=0,startMidY=0,startZoomX=0,startZoomY=0,panStartX=0,panStartY=0,panBaseX=0,panBaseY=0,gestureMode='';
function applyMobileZoom(){
  const zl=document.getElementById('zoomLevelMobile');
  if(!isMobile()){book.style.transform='';book.classList.remove('zoomed');if(zl)zl.textContent='100%';return;}
  zoomScale=Math.max(1,Math.min(4,zoomScale));
  if(zoomScale===1){zoomX=0;zoomY=0;book.classList.remove('zoomed')}else{book.classList.add('zoomed')}
  book.style.transform=`translate(${zoomX}px,${zoomY}px) scale(${zoomScale})`;
  if(zl)zl.textContent=Math.round(zoomScale*100)+'%';
}
function resetMobileZoom(){zoomScale=1;zoomX=0;zoomY=0;applyMobileZoom()}
function touchDist(a,b){return Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)}
function touchMid(a,b){return{x:(a.clientX+b.clientX)/2,y:(a.clientY+b.clientY)/2}}

function isMobile(){return window.matchMedia('(max-width:760px)').matches}
function spreadFor(i){if(isMobile())return[i];if(i===0)return[0];const left=i%2===1?i:i-1;return[left,left+1].filter(x=>x<pages.length)}
function labelFor(ids){return ids.length===1?`${ids[0]+1} / ${pages.length}`:`${ids[0]+1}-${ids[ids.length-1]+1} / ${pages.length}`}
function render(dir){
  if(isMobile())resetMobileZoom();
  const ids=spreadFor(index);book.className='book '+(ids.length===1?'cover':'spread');book.innerHTML='';
  ids.forEach((id,k)=>{const p=document.createElement('div');p.className='page '+(ids.length===1?'right':(k===0?'left':'right'));const img=document.createElement('img');img.src=pages[id];img.alt=`입학안내 ${id+1}페이지`;img.draggable=false;p.appendChild(img);book.appendChild(p)});
  if(dir){book.classList.add(dir==='next'?'turn-next':'turn-prev');setTimeout(()=>book.classList.remove('turn-next','turn-prev'),470)}
  counter.textContent=labelFor(ids);prev.disabled=index===0;next.disabled=index>=pages.length-1;bar.style.width=((ids[ids.length-1]+1)/pages.length*100)+'%';
}
function goNext(){if(animating||index>=pages.length-1)return;animating=true;index=isMobile()?index+1:(index===0?1:Math.min(index+2,pages.length-1));render('next');setTimeout(()=>animating=false,480)}
function goPrev(){if(animating||index<=0)return;animating=true;index=isMobile()?index-1:(index<=1?0:Math.max(1,index-2));render('prev');setTimeout(()=>animating=false,480)}
prev.addEventListener('click',goPrev);next.addEventListener('click',goNext);

const deptBtn=document.getElementById('deptBtn'),deptSub=document.getElementById('deptSub');
deptBtn.addEventListener('click',e=>{
  e.stopPropagation();
  const willOpen=!deptSub.classList.contains('open');
  deptSub.classList.toggle('open',willOpen);
  deptBtn.textContent=willOpen?'학과소개 ▲':'학과소개 ▼';
  if(willOpen && isMobile()){
    const r=deptBtn.getBoundingClientRect();
    const panelW=Math.min(230,window.innerWidth-24);
    let left=Math.max(12,Math.min(r.left,window.innerWidth-panelW-12));
    deptSub.style.left=left+'px';
    deptSub.style.top=(r.bottom+6)+'px';
    deptSub.style.width=panelW+'px';
  }
});
document.addEventListener('click',e=>{if(!e.target.closest('.dept-menu')){deptSub.classList.remove('open');deptBtn.textContent='학과소개 ▼'}});
window.addEventListener('resize',()=>{
  if(deptSub.classList.contains('open') && isMobile()){
    const r=deptBtn.getBoundingClientRect();
    const panelW=Math.min(230,window.innerWidth-24);
    let left=Math.max(12,Math.min(r.left,window.innerWidth-panelW-12));
    deptSub.style.left=left+'px';
    deptSub.style.top=(r.bottom+6)+'px';
    deptSub.style.width=panelW+'px';
  }
});
document.querySelectorAll('[data-goto]').forEach(btn=>btn.addEventListener('click',()=>{
  index=Number(btn.dataset.goto);render();
  deptSub.classList.remove('open');deptBtn.textContent='학과소개 ▼';
}));

document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')goNext();if(e.key==='ArrowLeft')goPrev()});
const shell=document.getElementById('shell');
shell.addEventListener('touchstart',e=>{
  if(!isMobile())return;
  swiped=false;
  if(e.touches.length===2){
    e.preventDefault();pinching=true;gestureMode='pinch';
    startDist=touchDist(e.touches[0],e.touches[1]);startScale=zoomScale;
    const m=touchMid(e.touches[0],e.touches[1]);startMidX=m.x;startMidY=m.y;startZoomX=zoomX;startZoomY=zoomY;
    return;
  }
  if(e.touches.length===1){
    const t=e.touches[0];sx=t.screenX;
    if(zoomScale>1){e.preventDefault();gestureMode='pan';panStartX=t.clientX;panStartY=t.clientY;panBaseX=zoomX;panBaseY=zoomY}
    else{gestureMode='swipe'}
  }
},{passive:false});
shell.addEventListener('touchmove',e=>{
  if(!isMobile())return;
  if(e.touches.length===2){
    e.preventDefault();pinching=true;gestureMode='pinch';
    const d=touchDist(e.touches[0],e.touches[1]);
    zoomScale=Math.max(1,Math.min(4,startScale*(d/startDist)));
    const m=touchMid(e.touches[0],e.touches[1]);
    zoomX=startZoomX+(m.x-startMidX);zoomY=startZoomY+(m.y-startMidY);applyMobileZoom();
  }else if(e.touches.length===1&&gestureMode==='pan'&&zoomScale>1){
    e.preventDefault();const t=e.touches[0];zoomX=panBaseX+(t.clientX-panStartX);zoomY=panBaseY+(t.clientY-panStartY);applyMobileZoom();
  }
},{passive:false});
shell.addEventListener('touchend',e=>{
  if(!isMobile())return;
  if(gestureMode==='pinch'){
    if(e.touches.length<2){pinching=false;if(zoomScale<1.08)resetMobileZoom();gestureMode='';}
    return;
  }
  if(gestureMode==='pan'){if(e.touches.length===0)gestureMode='';return;}
  if(gestureMode==='swipe'&&e.changedTouches.length){
    const dx=e.changedTouches[0].screenX-sx;
    if(Math.abs(dx)>45){swiped=true;(dx<0?goNext():goPrev)();setTimeout(()=>swiped=false,350)}
  }
  gestureMode='';
},{passive:false});
shell.addEventListener('dblclick',()=>{if(isMobile())resetMobileZoom()});
book.addEventListener('click',e=>{if(swiped||animating||(isMobile()&&zoomScale>1.02))return;const page=e.target.closest('.page');if(!page)return;if(isMobile()||book.classList.contains('cover')){const r=page.getBoundingClientRect();(e.clientX<r.left+r.width/2?goPrev:goNext)()}else{(page.classList.contains('left')?goPrev:goNext)()}});

// 모바일 확대/축소 보조 버튼: 브라우저별 핀치 제스처 차이에 대한 확실한 대안
document.getElementById('zoomInMobile').addEventListener('click',()=>{if(!isMobile())return;zoomScale=Math.min(4,zoomScale+0.5);applyMobileZoom()});
document.getElementById('zoomOutMobile').addEventListener('click',()=>{if(!isMobile())return;zoomScale=Math.max(1,zoomScale-0.5);if(zoomScale===1){zoomX=0;zoomY=0}applyMobileZoom()});
document.getElementById('zoomResetMobile').addEventListener('click',()=>{if(isMobile())resetMobileZoom()});

// iOS/Safari 계열의 gesture 이벤트도 함께 지원
let gestureBaseScale=1;
shell.addEventListener('gesturestart',e=>{if(!isMobile())return;e.preventDefault();gestureBaseScale=zoomScale;pinching=true;},{passive:false});
shell.addEventListener('gesturechange',e=>{if(!isMobile())return;e.preventDefault();zoomScale=Math.max(1,Math.min(4,gestureBaseScale*e.scale));applyMobileZoom();},{passive:false});
shell.addEventListener('gestureend',e=>{if(!isMobile())return;e.preventDefault();pinching=false;if(zoomScale<1.08)resetMobileZoom();},{passive:false});

document.getElementById('zoom').addEventListener('click',()=>{
  const pageUrls=pages.map(src=>new URL(src,location.href).href);
  const w=window.open('','_blank');
  if(!w){alert('팝업이 차단되어 있습니다. 팝업을 허용한 뒤 다시 시도해 주세요.');return;}
  const title='2027학년도 입학 안내 크게 보기';
  const initial=index;
  w.document.write(`<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,user-scalable=yes,viewport-fit=cover"><title>${title}</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;background:#222;color:#fff;font-family:"Pretendard","Noto Sans KR","Malgun Gothic",Arial,sans-serif}body{padding:16px;overflow:auto}.zoom-wrap{position:relative;min-height:calc(100vh - 32px);display:flex;align-items:center;justify-content:center;touch-action:pan-y pinch-zoom;user-select:none}.spread{display:flex;align-items:stretch;justify-content:center;max-width:1500px;width:100%}.zoom-page{position:relative;background:#fff;box-shadow:0 12px 34px rgba(0,0,0,.35);overflow:hidden;cursor:pointer;flex:0 1 50%;max-width:50%}.zoom-page img{display:block;width:100%;height:auto;max-height:calc(100vh - 32px);object-fit:contain}.zoom-left{border-radius:10px 0 0 10px}.zoom-right{border-radius:0 10px 10px 0}.single .zoom-page{flex:0 1 auto;max-width:min(900px,96vw);border-radius:10px}.single .zoom-page img{max-height:calc(100vh - 32px)}.counter{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:10;background:rgba(0,0,0,.68);padding:8px 13px;border-radius:999px;font-weight:800;font-size:14px;backdrop-filter:blur(6px);pointer-events:none}.navhint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);z-index:10;background:rgba(0,0,0,.58);padding:7px 12px;border-radius:999px;font-size:12px;white-space:nowrap;pointer-events:none;opacity:.86}.edge{position:fixed;top:0;bottom:0;width:18%;z-index:8;cursor:pointer}.edge.prev{left:0}.edge.next{right:0}@media(max-width:760px){body{padding:8px}.zoom-wrap{min-height:calc(100vh - 16px);display:block}.spread,.single{display:block;width:100%}.spread .zoom-page,.single .zoom-page{max-width:96vw;width:96vw;margin:0 auto;border-radius:10px}.spread .zoom-page.left{display:none}.zoom-page img,.single .zoom-page img{width:100%;height:auto;max-height:none}.navhint{font-size:11px;bottom:8px}.counter{top:8px}}
</style></head><body><div id="counter" class="counter"></div><div id="wrap" class="zoom-wrap"></div><div class="edge prev" id="edgePrev" aria-label="이전 페이지"></div><div class="edge next" id="edgeNext" aria-label="다음 페이지"></div><div class="navhint">화면 왼쪽·오른쪽 클릭 또는 ← → 키로 페이지 이동</div><script>
const pages=${JSON.stringify(pageUrls)};let index=${initial};
const wrap=document.getElementById('wrap'),counter=document.getElementById('counter');
const mobile=()=>matchMedia('(max-width:760px)').matches;
function idsFor(i){if(mobile())return[i];if(i===0)return[0];const left=i%2===1?i:i-1;return[left,left+1].filter(x=>x<pages.length)}
function render(){const ids=idsFor(index);wrap.innerHTML='';const holder=document.createElement('div');holder.className=ids.length===1?'single':'spread';ids.forEach((id,k)=>{const p=document.createElement('div');p.className='zoom-page '+(ids.length===2?(k===0?'zoom-left left':'zoom-right right'):'');const img=document.createElement('img');img.src=pages[id];img.alt='입학안내 '+(id+1)+'페이지';img.draggable=false;p.appendChild(img);p.addEventListener('click',e=>{e.stopPropagation();if(mobile()||ids.length===1){const r=p.getBoundingClientRect();e.clientX<r.left+r.width/2?goPrev():goNext()}else{k===0?goPrev():goNext()}});holder.appendChild(p)});wrap.appendChild(holder);counter.textContent=ids.length===1?(ids[0]+1)+' / '+pages.length:(ids[0]+1)+'-'+(ids[ids.length-1]+1)+' / '+pages.length}
function goNext(){if(index>=pages.length-1)return;index=mobile()?index+1:(index===0?1:Math.min(index+2,pages.length-1));render()}
function goPrev(){if(index<=0)return;index=mobile()?index-1:(index<=1?0:Math.max(1,index-2));render()}
document.getElementById('edgePrev').addEventListener('click',goPrev);document.getElementById('edgeNext').addEventListener('click',goNext);
document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')goPrev();if(e.key==='ArrowRight')goNext()});
let sx=0,sy=0,active=false;wrap.addEventListener('touchstart',e=>{if(e.touches.length!==1){active=false;return}active=true;sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});wrap.addEventListener('touchend',e=>{if(!active||!e.changedTouches.length)return;active=false;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.2){dx<0?goNext():goPrev()}},{passive:true});
let wasMobile=mobile();addEventListener('resize',()=>{const now=mobile();if(now!==wasMobile){wasMobile=now;render()}});render();
<\/script></body></html>`);w.document.close();
});
let lastMobile=isMobile();window.addEventListener('resize',()=>{const now=isMobile();if(now!==lastMobile){lastMobile=now;resetMobileZoom();render()}});
render();
</script>
</body>
</html>
